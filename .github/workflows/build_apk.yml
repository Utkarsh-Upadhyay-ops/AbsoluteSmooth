name: Build AbsoluteSmooth Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate AbsoluteSmooth Android Project Files
        run: |
          mkdir -p app/src/main/java/com/aiuhd/videoenhancer
          echo '' | base64 -d > settings.gradle
          echo 'cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguMi4yJyBhcHBseSBmYWxzZQogICAgaWQgJ29yZy5qZXRicmFpbnMua290bGluLmFuZHJvaWQnIHZlcnNpb24gJzEuOS4yMicgYXBwbHkgZmFsc2UKfQo=' | base64 -d > build.gradle
          echo 'b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyMDQ4bSAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD1mYWxzZQprb3RsaW4uY29kZS5zdHlsZT1vZmZpY2lhbAo=' | base64 -d > gradle.properties
          echo '' | base64 -d > app/build.gradle
          echo '' | base64 -d > app/src/main/AndroidManifest.xml
          echo '' | base64 -d > app/src/main/java/com/aiuhd/videoenhancer/MainActivity.kt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

       - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4 
        with:
        gradle-version: '8.7'
     - name: Assemble AbsoluteSmooth Debug APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload AbsoluteSmooth APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbsoluteSmooth-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Release AbsoluteSmooth APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: AbsoluteSmooth v1.0.0
          files: app/build/outputs/apk/debug/app-debug.apk
