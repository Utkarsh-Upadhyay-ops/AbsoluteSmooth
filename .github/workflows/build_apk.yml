name: Build AbsoluteSmooth Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate AbsoluteSmooth Project Files
        shell: python
        run: |
          from pathlib import Path
          h = "ht" + "tp://"
          hs = "ht" + "tps://"
          Path("app/src/main/java/com/aiuhd/app").mkdir(parents=True, exist_ok=True)
          Path("settings.gradle").write_text(
              'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\n'
              'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\n'
              'rootProject.name = "AbsoluteSmooth"\ninclude(":app")\n'
          )
          Path("build.gradle").write_text(
              'plugins {\n'
              '  id "com.android.application" version "8.2.2" apply false\n'
              '  id "org.jetbrains.kotlin.android" version "1.9.22" apply false\n'
              '}\n'
          )
          Path("gradle.properties").write_text("org.gradle.jvmargs=-Xmx2048m\nandroid.useAndroidX=false\n")
          Path("app/build.gradle").write_text(
              'plugins { id "com.android.application"; id "org.jetbrains.kotlin.android" }\n'
              'android {\n'
              '  namespace "com.aiuhd.app"\n'
              '  compileSdk 34\n'
              '  defaultConfig { applicationId "com.aiuhd.app"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }\n'
              '  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }\n'
              '  kotlinOptions { jvmTarget = "17" }\n'
              '}\n'
          )
          Path("app/src/main/AndroidManifest.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<manifest xmlns:android="' + h + 'schemas.android.com/apk/res/android">\n'
              '  <uses-permission android:name="android.permission.INTERNET"/>\n'
              '  <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n'
              '  <application android:label="AbsoluteSmooth" android:usesCleartextTraffic="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">\n'
              '    <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">\n'
              '      <intent-filter>\n'
              '        <action android:name="android.intent.action.MAIN"/>\n'
              '        <category android:name="android.intent.category.LAUNCHER"/>\n'
              '      </intent-filter>\n'
              '    </activity>\n'
              '  </application>\n'
              '</manifest>\n'
          )
          Path("app/src/main/java/com/aiuhd/app/MainActivity.kt").write_text(
              'package com.aiuhd.app\n'
              'import android.app.*\n'
              'import android.content.*\n'
              'import android.net.Uri\n'
              'import android.os.*\n'
              'import android.view.*\n'
              'import android.webkit.*\n'
              'import android.widget.*\n'
              'class MainActivity : Activity() {\n'
              '  private lateinit var wv: WebView\n'
              '  private var uploadCb: ValueCallback<Array<Uri>>? = null\n'
              '  override fun onCreate(b: Bundle?) {\n'
              '    super.onCreate(b)\n'
              '    window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)\n'
              '    val p = getSharedPreferences("abs", Context.MODE_PRIVATE)\n'
              '    val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }\n'
              '    val bar = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(24, 16, 24, 16) }\n'
              '    val lbl = TextView(this).apply { text = "AbsoluteSmooth 120FPS"; textSize = 16f; layoutParams = LinearLayout.LayoutParams(0, -2, 1f) }\n'
              '    val btn = Button(this).apply { text = "Set Colab Link"; setOnClickListener { askUrl() } }\n'
              '    bar.addView(lbl); bar.addView(btn)\n'
              '    wv = WebView(this).apply {\n'
              '      layoutParams = LinearLayout.LayoutParams(-1, 0, 1f)\n'
              '      settings.javaScriptEnabled = true; settings.domStorageEnabled = true; settings.allowFileAccess = true\n'
              '      webViewClient = WebViewClient()\n'
              '      webChromeClient = object : WebChromeClient() {\n'
              '        override fun onShowFileChooser(v: WebView?, cb: ValueCallback<Array<Uri>>?, p: FileChooserParams?): Boolean {\n'
              '          uploadCb?.onReceiveValue(null); uploadCb = cb\n'
              '          val i = Intent(Intent.ACTION_GET_CONTENT).apply { addCategory(Intent.CATEGORY_OPENABLE); type = "video/mp4" }\n'
              '          startActivityForResult(Intent.createChooser(i, "Select Video"), 101)\n'
              '          return true\n'
              '        }\n'
              '      }\n'
              '      setDownloadListener { url, ua, cd, mime, _ ->\n'
              '        val fn = URLUtil.guessFileName(url, cd, mime ?: "video/mp4")\n'
              '        val req = DownloadManager.Request(Uri.parse(url)).apply {\n'
              '          setMimeType(mime ?: "video/mp4"); addRequestHeader("User-Agent", ua)\n'
              '          setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)\n'
              '          setDestinationInExternalPublicDir(Environment.DIRECTORY_MOVIES, fn)\n'
              '        }\n'
              '        (getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager).enqueue(req)\n'
              '      }\n'
              '    }\n'
              '    root.addView(bar); root.addView(wv); setContentView(root)\n'
              '    val saved = p.getString("url", "") ?: ""\n'
              '    if (saved.isEmpty()) askUrl() else wv.loadUrl(saved)\n'
              '  }\n'
              '  private fun askUrl() {\n'
              '    val inp = EditText(this).apply { hint = "' + hs + 'xxxx.gradio.live"; setSingleLine(true) }\n'
              '    AlertDialog.Builder(this).setTitle("Connect Cloud GPU").setView(inp).setPositiveButton("Go") { _, _ ->\n'
              '      var u = inp.text.toString().trim()\n'
              '      if (u.isNotEmpty()) {\n'
              '        if (!u.startsWith("http")) u = "' + hs + '" + u\n'
              '        getSharedPreferences("abs", Context.MODE_PRIVATE).edit().putString("url", u).apply()\n'
              '        wv.loadUrl(u)\n'
              '      }\n'
              '    }.setNegativeButton("Cancel", null).show()\n'
              '  }\n'
              '  override fun onActivityResult(req: Int, res: Int, d: Intent?) {\n'
              '    if (req == 101) { uploadCb?.onReceiveValue(if (res == RESULT_OK && d?.data != null) arrayOf(d.data!!) else null); uploadCb = null }\n'
              '  }\n'
              '}\n'
          )

      - name: Assemble AbsoluteSmooth Debug APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload AbsoluteSmooth APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbsoluteSmooth-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release AbsoluteSmooth APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: v1.0.0
          name: AbsoluteSmooth v1.0.0
          files: app/build/outputs/apk/debug/app-debug.apk
