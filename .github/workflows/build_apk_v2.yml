name: Build AbsoluteSmooth Android APK v2.0.0

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate AbsoluteSmooth v2.0.0 Project Files
        shell: python
        run: |
          import base64, zlib
          from pathlib import Path

          Path("app/src/main/java/com/aiuhd/app").mkdir(parents=True, exist_ok=True)
          Path("app/src/main/assets").mkdir(parents=True, exist_ok=True)

          studio_b64 = ""
          Path("app/src/main/assets/studio.html").write_text(
              zlib.decompress(base64.b64decode(studio_b64)).decode("utf-8"),
              encoding="utf-8"
          )

          Path("settings.gradle").write_text(
              'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\n'
              'dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\n'
              'rootProject.name = "AbsoluteSmooth"\ninclude(":app")\n'
          )
          Path("build.gradle").write_text(
              'plugins {\n'
              '  id "com.android.application" version "8.2.2" apply false\n'
              '  id "org.jetbrains.kotlin.android" version "1.9.22" apply false\n'
              '}\n'
          )
          Path("gradle.properties").write_text("org.gradle.jvmargs=-Xmx2048m\nandroid.useAndroidX=false\n")
          Path("app/build.gradle").write_text(
              'plugins { id "com.android.application"; id "org.jetbrains.kotlin.android" }\n'
              'android {\n'
              '  namespace "com.aiuhd.app"\n'
              '  compileSdk 34\n'
              '  defaultConfig { applicationId "com.aiuhd.app"; minSdk 24; targetSdk 34; versionCode 2; versionName "2.0.0" }\n'
              '  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }\n'
              '  kotlinOptions { jvmTarget = "17" }\n'
              '}\n'
          )
          Path("app/src/main/AndroidManifest.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '  <uses-permission android:name="android.permission.INTERNET"/>\n'
              '  <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n'
              '  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n'
              '  <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>\n'
              '  <application android:label="AbsoluteSmooth" android:usesCleartextTraffic="true" android:hardwareAccelerated="true" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">\n'
              '    <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">\n'
              '      <intent-filter>\n'
              '        <action android:name="android.intent.action.MAIN"/>\n'
              '        <category android:name="android.intent.category.LAUNCHER"/>\n'
              '      </intent-filter>\n'
              '    </activity>\n'
              '  </application>\n'
              '</manifest>\n'
          )
          Path("app/src/main/java/com/aiuhd/app/MainActivity.kt").write_text(
              'package com.aiuhd.app\n'
              'import android.annotation.SuppressLint\n'
              'import android.app.*\n'
              'import android.content.*\n'
              'import android.media.MediaScannerConnection\n'
              'import android.net.Uri\n'
              'import android.os.*\n'
              'import android.util.Base64\n'
              'import android.view.*\n'
              'import android.webkit.*\n'
              'import android.widget.*\n'
              'import java.io.File\n'
              'class MainActivity : Activity() {\n'
              '  private lateinit var wv: WebView\n'
              '  private var uploadCb: ValueCallback<Array<Uri>>? = null\n'
              '  inner class AndroidBridge {\n'
              '    @JavascriptInterface\n'
              '    fun saveVideo(dataUrl: String, fileName: String) {\n'
              '      try {\n'
              '        val b64 = dataUrl.substringAfter("base64,", "")\n'
              '        if (b64.isEmpty()) return\n'
              '        val bytes = Base64.decode(b64, Base64.DEFAULT)\n'
              '        val dir = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MOVIES), "AbsoluteSmooth")\n'
              '        if (!dir.exists()) dir.mkdirs()\n'
              '        val outFile = File(dir, fileName)\n'
              '        outFile.writeBytes(bytes)\n'
              '        MediaScannerConnection.scanFile(this@MainActivity, arrayOf(outFile.absolutePath), arrayOf("video/webm"), null)\n'
              '        runOnUiThread { Toast.makeText(this@MainActivity, "Saved to Movies/AbsoluteSmooth/$fileName", Toast.LENGTH_LONG).show() }\n'
              '      } catch (e: Exception) {\n'
              '        runOnUiThread { Toast.makeText(this@MainActivity, "Save failed: ${e.message}", Toast.LENGTH_LONG).show() }\n'
              '      }\n'
              '    }\n'
              '  }\n'
              '  @SuppressLint("SetJavaScriptEnabled")\n'
              '  override fun onCreate(b: Bundle?) {\n'
              '    super.onCreate(b)\n'
              '    window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)\n'
              '    wv = WebView(this).apply {\n'
              '      layoutParams = ViewGroup.LayoutParams(-1, -1)\n'
              '      settings.javaScriptEnabled = true\n'
              '      settings.domStorageEnabled = true\n'
              '      settings.allowFileAccess = true\n'
              '      settings.allowContentAccess = true\n'
              '      settings.mediaPlaybackRequiresUserGesture = false\n'
              '      settings.mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW\n'
              '      addJavascriptInterface(AndroidBridge(), "AndroidBridge")\n'
              '      webViewClient = WebViewClient()\n'
              '      webChromeClient = object : WebChromeClient() {\n'
              '        override fun onShowFileChooser(v: WebView?, cb: ValueCallback<Array<Uri>>?, p: FileChooserParams?): Boolean {\n'
              '          uploadCb?.onReceiveValue(null); uploadCb = cb\n'
              '          val i = Intent(Intent.ACTION_GET_CONTENT).apply { addCategory(Intent.CATEGORY_OPENABLE); type = "video/" + "*" }\n'
              '          startActivityForResult(Intent.createChooser(i, "Select Video"), 101)\n'
              '          return true\n'
              '        }\n'
              '      }\n'
              '    }\n'
              '    setContentView(wv)\n'
              '    wv.loadUrl("file:///android_asset/studio.html")\n'
              '  }\n'
              '  override fun onActivityResult(req: Int, res: Int, d: Intent?) {\n'
              '    if (req == 101) { uploadCb?.onReceiveValue(if (res == RESULT_OK && d?.data != null) arrayOf(d.data!!) else null); uploadCb = null }\n'
              '  }\n'
              '  override fun onBackPressed() { if (wv.canGoBack()) wv.goBack() else super.onBackPressed() }\n'
              '}\n'
          )

      - name: Assemble AbsoluteSmooth v2.0.0 Debug APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          ./gradle-8.5/bin/gradle assembleDebug --no-daemon

      - name: Upload AbsoluteSmooth v2.0.0 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbsoluteSmooth-v2.0.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release AbsoluteSmooth v2.0.0 APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: v2.0.0
          name: AbsoluteSmooth v2.0.0 (CapCut-Style Studio UI)
          files: app/build/outputs/apk/debug/app-debug.apk
